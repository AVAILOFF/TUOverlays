# Собирает APK помощника для Block Blast (blockblast-helper/) и прикладывает его к запуску.
# APK: вкладка Actions → последний запуск «Build Block Blast Helper» → Artifacts.

name: Build Block Blast Helper

on:
  push:
    paths:
      - 'blockblast-helper/**'
      - '.github/workflows/blockblast-helper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Tests and APK
        working-directory: blockblast-helper
        run: gradle --no-daemon testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: BlockBlastHelper-apk
          path: blockblast-helper/app/build/outputs/apk/release/*.apk
