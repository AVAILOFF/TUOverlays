<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Support the project — TU Overlays</title>
<meta name="description" content="Ways to support TU Overlays development. Page coming soon.">
<meta name="theme-color" content="#02102c">
<meta name="robots" content="noindex">
<script src="../scripts/site-lock.js"></script>
<link rel="icon" href="../img/favicon.png">

<style>
:root{
  --bg:        #02102c;
  --bg-sub:    #010b1f;
  --glass:     rgba(8, 30, 68, .58);

  --line:      rgba(124,162,224,.13);
  --line-2:    rgba(124,162,224,.24);
  --line-3:    rgba(124,162,224,.40);

  --tx:        #e4ecfb;
  --tx-2:      #9fb2d4;
  --tx-3:      #64789e;
  --tx-4:      #4a5f86;

  --brand:     #ff0066;
  --brand-lo:  #c8004f;
  --brand-hi:  #ff5f96;
  --data:      #3fd8e0;

  --f-display:'Bahnschrift','DIN Alternate','DIN Condensed','Avenir Next Condensed','Segoe UI Variable Display','Franklin Gothic Medium',system-ui,sans-serif;
  --f-text:'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;
  --f-mono:'Cascadia Mono','Cascadia Code','SFMono-Regular','SF Mono','JetBrains Mono',Consolas,'Liberation Mono',monospace;

  --maxw: 1180px;
  --r:    13px;
  --r-lg: 20px;
  --pad: clamp(20px, 5vw, 40px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;zoom:1.5}
html,body{max-width:100%;overflow-x:clip;height:100%}
body{
  margin:0;min-height:100%;
  background:var(--bg);color:var(--tx);
  font-family:var(--f-text);font-size:16px;line-height:1.62;letter-spacing:.005em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  display:flex;flex-direction:column;
}
img,svg{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
::selection{background:rgba(255,0,102,.32);color:#fff}
:focus-visible{outline:2px solid var(--data);outline-offset:3px;border-radius:4px}

.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--pad)}

h1{
  font-family:var(--f-display);font-weight:600;font-stretch:88%;
  letter-spacing:-.026em;line-height:1.02;margin:0;
  font-size:clamp(2.6rem,8vw,4.6rem);
}
.acc{
  color:var(--brand);
  background:linear-gradient(180deg,var(--brand-hi),var(--brand));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 0 46px rgba(255,0,102,.42);
}
.lead{color:var(--tx-2);font-size:clamp(1rem,1.6vw,1.15rem);max-width:52ch;margin:0 auto}

.eyebrow{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--tx-3);
}
.eyebrow::before{content:'';width:22px;height:1px;background:var(--brand);box-shadow:0 0 9px rgba(255,0,102,.85)}

/* header */
.hdr{padding-block:18px;border-bottom:1px solid transparent}
.hdr-in{display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:11px}
.logo-mk{width:26px;height:auto;display:block}
.logo-tx{font-family:var(--f-display);font-stretch:86%;font-weight:600;font-size:16.5px}
.logo-tx b{color:var(--tx)}
.logo-tx span{color:var(--tx-3);font-weight:400}
.hdr-back{margin-left:auto;display:inline-flex;align-items:center;gap:8px;
  font-family:var(--f-mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-3);
  transition:color .2s}
.hdr-back:hover{color:var(--tx)}

/* hero-ish center stage */
.stage{
  position:relative;flex:1;display:flex;align-items:center;justify-content:center;
  overflow:hidden;padding-block:60px;
}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none}
.glow-a{width:min(900px,120vw);height:480px;left:50%;top:-140px;transform:translateX(-50%);
  background:radial-gradient(50% 50% at 50% 50%, rgba(255,0,102,.4), rgba(255,0,102,0) 70%)}
.glow-b{width:min(600px,90vw);height:380px;left:12%;bottom:-160px;
  background:radial-gradient(50% 50% at 50% 50%, rgba(63,216,224,.14), rgba(63,216,224,0) 70%)}

.stage-in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}

.wip{
  display:inline-flex;align-items:center;gap:9px;
  padding:8px 16px;border-radius:999px;margin-top:4px;
  background:rgba(8,30,68,.7);border:1px solid var(--line-2);
  font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-2);
}
.wip i{width:6px;height:6px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px var(--warn);flex:none;
  animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.btn{
  --bh:46px;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  height:var(--bh);padding:0 22px;border-radius:10px;margin-top:10px;
  font-family:var(--f-display);font-stretch:92%;font-weight:600;font-size:15px;
  color:var(--tx);border:1px solid var(--line-2);background:rgba(255,255,255,.02);
  backdrop-filter:blur(8px);transition:transform .18s,border-color .2s,background .2s;
}
.btn:hover{border-color:var(--line-3);background:rgba(255,255,255,.05);transform:translateY(-1px)}
.btn svg{flex:none}

.ftr{border-top:1px solid var(--line);padding-block:22px}
.ftr p{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--tx-4);text-align:center;margin:0}
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap hdr-in">
    <a class="logo" href="index.html" aria-label="TU Overlays — home">
      <img class="logo-mk" src="../img/logo.png" alt="">
      <span class="logo-tx"><b>TU</b> <span>Overlays</span></span>
    </a>
    <a class="hdr-back" href="index.html">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Home
    </a>
  </div>
</header>

<main class="stage">
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>
  <div class="wrap stage-in">
    <span class="eyebrow">Support the project</span>
    <h1>Page <span class="acc">in progress</span></h1>
    <p class="lead">We're putting together ways to support TU Overlays development. Check back soon — everything you need will be here shortly.</p>
    <span class="wip"><i></i>Work in progress</span>
    <a class="btn" href="index.html">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to home
    </a>
  </div>
</main>

<footer class="ftr">
  <p>TU Overlays — independent project · © 2026</p>
</footer>

</body>
</html>
