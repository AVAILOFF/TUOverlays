<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 — страница не найдена · TU Overlays</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#02102c">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/tu-core.css">
<style>
/* 404 — the smallest possible expression of the system: canvas, one hairline,
   one chromatic action. Everything else comes from tu-core.css. */
body{display:flex;align-items:center;justify-content:center;min-height:100vh;
  padding:32px;text-align:center}
html,body{height:100%}
.wrap{max-width:560px;padding-inline:0}
.code{font-family:var(--f-mono);font-variant-numeric:tabular-nums;
  font-size:clamp(3rem,9vw,6rem);line-height:1;font-weight:600;letter-spacing:-.04em;
  color:var(--brand);margin:0}
.code::after{content:'';display:block;width:44px;height:1px;background:var(--line-2);margin:20px auto 0}
h1{margin:20px 0 0}
p{color:var(--tx-2);margin:14px auto 0;max-width:44ch}
.actions{display:flex;gap:var(--s3);flex-wrap:wrap;justify-content:center;margin-top:var(--s6)}
.en{margin-top:var(--s5);font-size:13px;color:var(--tx-3)}
.en a{color:var(--data)}
.en a:hover{text-decoration:underline}
</style>
</head>
<body>
  <main class="wrap">
    <p class="code">404</p>
    <h1>Такой страницы нет</h1>
    <p>Похоже, ссылка устарела или в адресе опечатка. Вернитесь на главную или сразу перейдите к загрузке.</p>
    <div class="actions">
      <a class="btn btn-primary btn-lg" href="/">На главную</a>
      <a class="btn btn-ghost btn-lg" href="/download">Скачать</a>
    </div>
    <p class="en">Page not found — <a href="/en/">go to the English homepage</a>.</p>
  </main>
</body>
</html>
